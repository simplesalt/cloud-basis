# GCP resources supporting Cloudflare SSO integration for the ssint-main
# account. Copied from simplesalt/brain manifests/gcp-sso.yaml
# (simplesalt/projects#184).
#
# Secret/gcp-credentials and ProviderConfig/gcp-default (also declared in
# this source file) are the deduped pair now canonicalized in
# 00-providers/gcp-provider.yaml — see that file's header for the full
# dedupe diff/decision. Everything below references providerConfigRef:
# gcp-default by name only.
#
# Enables the Admin SDK API (required for SCIM directory sync), provisions
# a dedicated service account, and generates a key that Crossplane writes
# automatically to the cloudflare-sso-agent-key Secret in crossplane-system.
#
# Domain-wide delegation for cloudflare-sso-agent must be configured
# out-of-band in the Google Workspace Admin console before SCIM can be
# activated.
---
# Enable the Admin SDK Directory API — required for SCIM group/user
# provisioning.
apiVersion: cloudplatform.gcp.upbound.io/v1beta1
kind: ProjectService
metadata:
  name: admin-googleapis-com
  labels:
    entity: ssint
    env: main
    capability: access
  annotations:
    crossplane.io/external-name: admin.googleapis.com
spec:
  forProvider:
    project: internalapps-481018
    service: admin.googleapis.com
    disableOnDestroy: false
    disableDependentServices: false
  providerConfigRef:
    name: gcp-default

---
# Dedicated service account for Cloudflare SSO SCIM provisioning.
# After creation, grant it domain-wide delegation in Google Workspace Admin
# with scopes:
#   https://www.googleapis.com/auth/admin.directory.group.readonly
#   https://www.googleapis.com/auth/admin.directory.user.readonly
apiVersion: cloudplatform.gcp.upbound.io/v1beta1
kind: ServiceAccount
metadata:
  name: cloudflare-sso-agent
  labels:
    entity: ssint
    env: main
    capability: access
  annotations:
    crossplane.io/external-name: cloudflare-sso-agent
spec:
  forProvider:
    project: internalapps-481018
    displayName: Cloudflare SSO SCIM Agent
    description: Used by Cloudflare Zero Trust for Google Workspace SCIM provisioning
  providerConfigRef:
    name: gcp-default

---
# Service account key — Crossplane creates the key in GCP and writes it to
# cloudflare-sso-agent-key (crossplane-system). Connection secret keys:
#   private_key      — base64-encoded JSON key (use for domain-wide
#                       delegation setup)
#   public_key       — corresponding public key
#   valid_after/before — key validity window
apiVersion: cloudplatform.gcp.upbound.io/v1beta1
kind: ServiceAccountKey
metadata:
  name: cloudflare-sso-agent-key
  labels:
    entity: ssint
    env: main
    capability: access
spec:
  forProvider:
    serviceAccountIdRef:
      name: cloudflare-sso-agent
  writeConnectionSecretToRef:
    namespace: crossplane-system
    name: cloudflare-sso-agent-key
  providerConfigRef:
    name: gcp-default
