# Runtime values for the Script's COOKIE_ENCRYPTION_KEY and MCP_SLUG
# bindings (30-mcp/worker-script.yaml). Script.spec.forProvider.bindings[].
# textSecretRef has no namespace field, so it only resolves Secrets in the
# Script's own namespace (crossplane-system) — this mirrors the values from
# Secret/mcp-server-generated (flux-system) into that namespace.
# ${mcp_slug} and ${cookie_encryption_key} are substituted by Flux at apply
# time; this file, unlike worker-script.yaml, is NOT substitute-disabled.
apiVersion: v1
kind: Secret
metadata:
  name: mcp-server-runtime
  namespace: crossplane-system
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    entity: cluster
    capability: access
type: Opaque
stringData:
  mcp_slug: "${mcp_slug}"
  cookie_encryption_key: "${cookie_encryption_key}"
