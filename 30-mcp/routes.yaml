# Workers Routes binding the ssint-main-mcp-server Worker (30-mcp/worker-script.yaml)
# to its public host and to the api.simplesalt.company documentation signpost.
# ${mcp_slug} is substituted by Flux from Secret/mcp-server-generated (flux-system) —
# this file, unlike worker-script.yaml, is NOT substitute-disabled.
apiVersion: workers.upjet-cloudflare.m.upbound.io/v1alpha1
kind: Route
metadata:
  name: main-mcp-server-route
  namespace: crossplane-system
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    entity: cluster
    capability: infra
spec:
  forProvider:
    zoneId: 260b251cdb53f8376875a8eb8d03ca0b
    pattern: r4x69awbkkotgfs44cmd.simplesalt.company/*
    script: main-mcp-server
  providerConfigRef:
    kind: ProviderConfig
    name: ssint-main
---
apiVersion: workers.upjet-cloudflare.m.upbound.io/v1alpha1
kind: Route
metadata:
  name: main-mcp-server-route-signpost
  namespace: crossplane-system
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    entity: cluster
    capability: infra
spec:
  forProvider:
    zoneId: 260b251cdb53f8376875a8eb8d03ca0b
    pattern: api.simplesalt.company/${mcp_slug}*
    script: main-mcp-server
  providerConfigRef:
    kind: ProviderConfig
    name: ssint-main
