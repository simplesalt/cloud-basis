apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - dns.yaml
  - kv.yaml
  - access-app.yaml
  - worker-script.yaml
  - routes.yaml
  - runtime-secret.yaml
  - vpc-services.yaml

patches:
  # Declares observability.traces until workers/mcp-server's generator emits it (simplesalt/projects#686), then this patch goes.
  - target:
      group: workers.upjet-cloudflare.m.upbound.io
      version: v1alpha1
      kind: Script
      name: main-mcp-server
      namespace: crossplane-system
    patch: |-
      apiVersion: workers.upjet-cloudflare.m.upbound.io/v1alpha1
      kind: Script
      metadata:
        name: main-mcp-server
        namespace: crossplane-system
      spec:
        forProvider:
          observability:
            traces:
              enabled: false
              headSamplingRate: 1
              persist: true
