# KV namespaces for the ssint-main Cloudflare account (ba92fe12...).
# Adopted via crossplane.io/external-name = namespace ID from CF API.
# These are managed here (not by wrangler) — wrangler only binds to them,
# it does not own the namespace lifecycle.

---
apiVersion: workers.upjet-cloudflare.m.upbound.io/v1alpha1
kind: KvNamespace
metadata:
  name: cf-main-kv-sot-test-results
  namespace: crossplane-system
  annotations:
    crossplane.io/external-name: b8f5e5a1be0240f6b484b4ab1258a6a8
  labels:
    entity: cluster
    capability: infra
spec:
  forProvider:
    accountId: ba92fe12c6c1275f965c7c86e3b392ac
    title: main-sot-test-results
  providerConfigRef:
    kind: ProviderConfig
    name: ssint-main
---
apiVersion: workers.upjet-cloudflare.m.upbound.io/v1alpha1
kind: KvNamespace
metadata:
  name: cf-main-kv-sot-test-results-dev
  namespace: crossplane-system
  annotations:
    crossplane.io/external-name: 05b9f242460f42b1bd29178bf85b2767
  labels:
    entity: cluster
    capability: infra
spec:
  forProvider:
    accountId: ba92fe12c6c1275f965c7c86e3b392ac
    title: main-sot-test-results-dev
  providerConfigRef:
    kind: ProviderConfig
    name: ssint-main
