apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Ordering: 00-providers must land (Ready/Synced) before anything in
# 10-cloudflare, 20-gcp, or 30-certs, since those directories contain
# managed resources that reference providerConfigRef: ssint-main /
# gcp-default. See README.md "Ordering" section for the full explanation —
# resource ordering within a single flat `resources:` list is not itself an
# apply-order guarantee under Flux's server-side apply, so if the destination
# cluster's Crossplane providers/CRDs are not already installed and healthy,
# split this Kustomization into a dependsOn chain instead of one flat build.
#
# quarantine/ is intentionally NOT listed here — see quarantine/README note
# and quarantine/cloudflare-zero-trust-idp-quarantine.yaml.
resources:
  - 00-providers
  - 10-cloudflare
  - 20-gcp
  - 30-certs
