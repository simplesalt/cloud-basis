apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Ordering: 00-providers must land (Ready/Synced) before anything in
# 10-cloudflare, since that directory contains managed resources that
# reference providerConfigRef: ssint-main. See README.md "Ordering" section
# for the full explanation — resource ordering within a single flat
# `resources:` list is not itself an apply-order guarantee under Flux's
# server-side apply, so if the destination cluster's Crossplane
# providers/CRDs are not already installed and healthy, split this
# Kustomization into a dependsOn chain instead of one flat build.
#
# 20-gcp/ and 30-certs/ were removed (simplesalt/projects#226): every
# object they declared is a duplicate of one simplesalt/brain already
# declares, and brain is the canonical owner going forward. See README.md
# "The dedupe" for the full accounting.
#
# quarantine/ is intentionally NOT listed here — see quarantine/README note
# and quarantine/cloudflare-zero-trust-idp-quarantine.yaml.
resources:
  - 00-providers
  - 10-cloudflare
