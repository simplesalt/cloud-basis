# Run-once generator for the MCP server's random values: mcp_slug (a
# path-obscuring identifier) and cookie_encryption_key (OAuth session cookie
# encryption). Mirrors fetch-ssint-main-tunnel-id's Job/RBAC shape
# (../cloudflare/tunnel.yaml) but creates rather than patches, and only when
# the target Secret doesn't already exist yet — this must never rotate a
# live cookie_encryption_key out from under active sessions.
#
# The Secret itself is deliberately NOT declared in git (no Secret/
# mcp-server-generated manifest here) so Flux never owns or prunes it; only
# this Job's RBAC references it by name.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-server-secret-generator
  namespace: flux-system
  labels:
    entity: cluster
    capability: access
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mcp-server-secret-generator
  namespace: flux-system
  labels:
    entity: cluster
    capability: access
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
rules:
  # Check for the Secret's existence — never grants read of its data beyond
  # what `get` returns to this Job's own ServiceAccount.
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [mcp-server-generated]
    verbs: [get]
  # `create` cannot be scoped by resourceNames (the object doesn't exist yet).
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mcp-server-secret-generator
  namespace: flux-system
  labels:
    entity: cluster
    capability: access
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
subjects:
  - kind: ServiceAccount
    name: mcp-server-secret-generator
    namespace: flux-system
roleRef:
  kind: Role
  name: mcp-server-secret-generator
  apiGroup: rbac.authorization.k8s.io
---
# Creates flux-system/mcp-server-generated (keys mcp_slug,
# cookie_encryption_key) only if it does not already exist; a no-op,
# exit-0 re-run otherwise. Values come from /dev/urandom inside the
# container and are never echoed — only success/no-op is logged.
# Re-trigger after accidental deletion by deleting the Job — Flux recreates
# it; deliberately never re-triggered on rotation, since rotation would
# invalidate every live session.
apiVersion: batch/v1
kind: Job
metadata:
  name: generate-mcp-server-secrets
  namespace: flux-system
  labels:
    entity: cluster
    capability: access
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 8
  template:
    metadata:
      labels:
        entity: cluster
        capability: access
    spec:
      serviceAccountName: mcp-server-secret-generator
      restartPolicy: OnFailure
      containers:
        - name: generate
          image: bitnami/kubectl:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              if kubectl get secret mcp-server-generated -n flux-system >/dev/null 2>&1; then
                echo "mcp-server-generated already exists; leaving it untouched"
                exit 0
              fi
              MCP_SLUG=$(LC_ALL=C tr -dc 'a-f0-9' < /dev/urandom | head -c 32)
              COOKIE_KEY=$(LC_ALL=C tr -dc 'a-f0-9' < /dev/urandom | head -c 64)
              kubectl create secret generic mcp-server-generated \
                -n flux-system \
                --from-literal=mcp_slug="$MCP_SLUG" \
                --from-literal=cookie_encryption_key="$COOKIE_KEY"
              echo "mcp-server-generated created"
