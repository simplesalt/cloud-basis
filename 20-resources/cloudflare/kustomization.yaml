apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# namespace.yaml is listed first as documentation of intent. The actual
# guarantee comes from Flux's server-side apply, which sorts by kind and
# applies Namespace before the namespaced objects below it — list order alone
# is not an apply-order guarantee (same caveat as the root kustomization.yaml).
resources:
  - namespace.yaml
  - r2.yaml
  - kv.yaml
  - tunnel.yaml
  - tunnel-token-job.yaml
  - tunnel-daemon.yaml
  - creds-job.yaml
