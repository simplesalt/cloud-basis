# DNS records for the ssint-main Cloudflare account (ba92fe12...).
# Created, not adopted — no crossplane.io/external-name annotation, so
# Crossplane creates the record in Cloudflare rather than expecting it
# to already exist.

apiVersion: dns.upjet-cloudflare.m.upbound.io/v1alpha1
kind: Record
metadata:
  name: simplesalt-company-spf
  namespace: crossplane-system
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    entity: cluster
    capability: infra
spec:
  forProvider:
    zoneId: 260b251cdb53f8376875a8eb8d03ca0b
    name: "@"
    type: TXT
    content: "v=spf1 include:_spf.google.com ~all"
    ttl: 1
  providerConfigRef:
    kind: ProviderConfig
    name: ssint-main
