apiVersion: v1
kind: Secret
metadata:
  name: dux-soup-event-handler-config
  namespace: crossplane-system
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    entity: cluster
    capability: infra
type: Opaque
stringData:
  branch: main
  route_path_sha256: 72e857bdba81ba5b43a38d00a7cb2ec4a0c2366b782bcc6d8f32408b2385eb77
  receiver_url: https://hooks.simplesalt.company/duxsoup/events
---
apiVersion: workers.upjet-cloudflare.m.upbound.io/v1alpha1
kind: Script
metadata:
  name: dux-soup-event-handler
  namespace: crossplane-system
  annotations:
    crossplane.io/external-name: main-dux-soup-event-handler
    kustomize.toolkit.fluxcd.io/prune: disabled
    kustomize.toolkit.fluxcd.io/substitute: disabled
  labels:
    entity: cluster
    capability: infra
spec:
  managementPolicies:
    - Observe
    - Create
    - Update
  forProvider:
    accountId: ba92fe12c6c1275f965c7c86e3b392ac
    scriptName: main-dux-soup-event-handler
    mainModule: DuxSoupEventHandler.js
    compatibilityDate: "2025-12-08"
    content: ""
    observability:
      enabled: true
    bindings:
      - name: BRANCH
        type: plain_text
        textSecretRef:
          name: dux-soup-event-handler-config
          key: branch
      - name: ROUTE_PATH_SHA256
        type: plain_text
        textSecretRef:
          name: dux-soup-event-handler-config
          key: route_path_sha256
      - name: main_InMessage_LI
        type: queue
        queueName: main-inmessage-li
      - name: OUTBOX
        type: durable_object_namespace
        className: EventOutbox
      - name: RECEIVER_URL
        type: plain_text
        textSecretRef:
          name: dux-soup-event-handler-config
          key: receiver_url
      - name: RECEIVER_KEY
        type: secret_text
        textSecretRef:
          name: dux-soup-event-handler
          key: receiver_key
  providerConfigRef:
    kind: ProviderConfig
    name: ssint-main
