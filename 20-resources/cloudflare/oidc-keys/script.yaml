apiVersion: workers.upjet-cloudflare.m.upbound.io/v1alpha1
kind: Script
metadata:
  name: oidc-keys
  namespace: crossplane-system
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    kustomize.toolkit.fluxcd.io/substitute: disabled
  labels:
    entity: cluster
    capability: infra
spec:
  forProvider:
    accountId: ba92fe12c6c1275f965c7c86e3b392ac
    scriptName: main-oidc-keys
    mainModule: OidcKeys.js
    compatibilityDate: "2026-09-01"
    # Filled from OidcKeys.js by kustomization.yaml.
    content: ""
    bindings:
      # KvNamespace cf-main-kv-oidc-keys (kv.yaml). The Script resource takes
      # only a literal id here, so it is copied from that namespace's
      # status.atProvider.id.
      - name: KEYS
        type: kv_namespace
        namespaceId: 93c380e5758140bc8bb8d48e64342bb1
    observability:
      enabled: true
      headSamplingRate: 1
      logs:
        enabled: true
        headSamplingRate: 1
        invocationLogs: true
        persist: true
      traces:
        enabled: false
        headSamplingRate: 1
        persist: true
  providerConfigRef:
    kind: ProviderConfig
    name: ssint-main
---
apiVersion: workers.upjet-cloudflare.m.upbound.io/v1alpha1
kind: Route
metadata:
  name: oidc-keys-route
  namespace: crossplane-system
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    entity: cluster
    capability: infra
spec:
  forProvider:
    zoneId: 260b251cdb53f8376875a8eb8d03ca0b
    pattern: oidc.simplesalt.company/*
    script: main-oidc-keys
  providerConfigRef:
    kind: ProviderConfig
    name: ssint-main
