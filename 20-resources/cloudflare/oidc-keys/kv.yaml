# Holds the ssint-main cluster's public signing keys under key "jwks". This
# repo declares only the namespace: the Kv item crossplane-system/oidc-jwks is
# server-side-applied every ten minutes by the oidc-keys-sync CronJob
# (simplesalt/basis, cluster-main-identity), which reads the namespace id from
# status.atProvider.id here. Declaring that item here would fight it.
apiVersion: workers.upjet-cloudflare.m.upbound.io/v1alpha1
kind: KvNamespace
metadata:
  name: cf-main-kv-oidc-keys
  namespace: crossplane-system
  annotations:
    # Created by this manifest on 2026-11-01; pinned so a recreate adopts it
    # rather than orphaning the id the Worker binding (script.yaml) uses.
    crossplane.io/external-name: 93c380e5758140bc8bb8d48e64342bb1
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    entity: cluster
    capability: infra
spec:
  forProvider:
    accountId: ba92fe12c6c1275f965c7c86e3b392ac
    title: main-oidc-keys
  providerConfigRef:
    kind: ProviderConfig
    name: ssint-main
