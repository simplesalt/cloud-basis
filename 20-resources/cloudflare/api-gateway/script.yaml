apiVersion: workers.upjet-cloudflare.m.upbound.io/v1alpha1
kind: Script
metadata:
  name: api-gateway
  namespace: crossplane-system
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    kustomize.toolkit.fluxcd.io/substitute: disabled
  labels:
    entity: cluster
    capability: infra
spec:
  forProvider:
    accountId: ba92fe12c6c1275f965c7c86e3b392ac
    scriptName: main-api-gateway
    mainModule: ApiGateway.js
    compatibilityDate: "2026-09-01"
    # Filled from ApiGateway.js by kustomization.yaml.
    content: ""
    observability:
      enabled: true
      headSamplingRate: 1
      logs:
        enabled: true
        headSamplingRate: 1
        invocationLogs: true
        persist: true
      traces:
        enabled: false
        headSamplingRate: 1
        persist: true
  providerConfigRef:
    kind: ProviderConfig
    name: ssint-main
---
# Catch-all on the host. Cloudflare picks the most specific matching route, so
# the existing Worker routes on api.simplesalt.company keep their paths.
apiVersion: workers.upjet-cloudflare.m.upbound.io/v1alpha1
kind: Route
metadata:
  name: api-gateway-route
  namespace: crossplane-system
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    entity: cluster
    capability: infra
spec:
  forProvider:
    zoneId: 260b251cdb53f8376875a8eb8d03ca0b
    pattern: api.simplesalt.company/*
    script: main-api-gateway
  providerConfigRef:
    kind: ProviderConfig
    name: ssint-main
