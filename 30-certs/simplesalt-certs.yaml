# ACME ClusterIssuer for the simplesalt.company zone.
#
# Copied from simplesalt/brain manifests/simplesalt-certs.yaml
# (simplesalt/projects#184), which itself was migrated from
# simplesalt/base-stack 3.infra/certs.yaml per simplesalt/projects#111 —
# simplesalt.company branding doesn't belong in a generic infra layer.
#
# NOT a Crossplane resource — this is a cert-manager object
# (cert-manager.io/v1 ClusterIssuer). It requires the cert-manager CRDs to
# already be installed from simplesalt/basis before this Kustomization can
# apply; it has no dependency on the Crossplane providers/ProviderConfigs
# in 00-providers.
#
# Currently unconsumed by any Certificate in either source repo (brain's
# existing Certificates, e.g. ai-tls, use the `famevans` ClusterIssuer,
# which is cluster-specific and stays out of this repo). Kept here so any
# future app that needs a real simplesalt.company-issued cert (rather than
# a cluster-domain one) has this available without another cross-repo
# migration.
#
# Secret/ss-acme-cf-token is kept in this same file/commit deliberately —
# splitting the ClusterIssuer from its solver Secret risks a Ready
# ClusterIssuer with an unreadable token reference.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: simplesalt
  namespace: cert-manager
  labels:
    entity: ssint
    env: main
    capability: access
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@simplesalt.company
    privateKeySecretRef:
      name: simplesalt
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: ss-acme-cf-token
              key: api-token
        selector:
          dnsZones:
            - "simplesalt.company"

---
# Cloudflare API token secret for simplesalt.company domain - managed
# externally. OUT-OF-BAND: empty on a fresh cluster, see README.md
# "Out-of-band secrets".
apiVersion: v1
kind: Secret
metadata:
  name: ss-acme-cf-token
  namespace: cert-manager
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: merge
type: Opaque
# data: {} # Managed externally via kubectl - Flux only ensures secret exists
